<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Hub</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f3ee; --surface:#ffffff; --surface2:#efeae2; --text:#2a2723; --muted:#7a7268;
  --line:#e2dccf; --accent:#d9622b; --accent-text:#ffffff; --good:#3f8f5a; --danger:#c0392b; --day:#2f7fbf;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a17; --surface:#27241f; --surface2:#322e28; --text:#f1ece4; --muted:#a39a8d;
    --line:#403a32; --accent:#f08a54; --accent-text:#1c1a17; --good:#6fc28a; --danger:#e8786a; --day:#7fb3d5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a17; --surface:#27241f; --surface2:#322e28; --text:#f1ece4; --muted:#a39a8d;
  --line:#403a32; --accent:#f08a54; --accent-text:#1c1a17; --good:#6fc28a; --danger:#e8786a; --day:#7fb3d5;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:600}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:22px}
.status{font-size:12px;color:var(--muted)}
nav{display:flex;gap:6px;overflow-x:auto;padding-top:10px}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit}
nav button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-size:17px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.card h2 a{font:12px sans-serif;color:var(--accent);cursor:pointer;text-decoration:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
button.btn{background:var(--accent);color:var(--accent-text);border:0;border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit;font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit}
button.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:2px 6px}
button.x:hover{color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>input[type=text],.row>input:not([type]){flex:1 1 140px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .t{flex:1;min-width:0;overflow-wrap:anywhere}
.done .t{text-decoration:line-through;color:var(--muted)}
.empty{color:var(--muted);font-style:italic;padding:6px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.whobox{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:4px;font-size:9px;font-weight:700;line-height:1;flex:0 0 auto;vertical-align:-2px;margin-right:2px;overflow:hidden}
.whobox.sm{width:12px;height:12px;font-size:7.5px;border-radius:3px;margin-right:1px}
.whobox.everyone{background:var(--surface2);color:var(--muted);font-size:10px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;color:var(--day);text-align:center;text-transform:uppercase}
.day{min-height:64px;background:var(--surface2);border-radius:8px;padding:4px;cursor:pointer;border:2px solid transparent;overflow:hidden}
.day.out{opacity:.4}
.day.today{border-color:var(--accent)}
.day.sel{background:var(--surface);border-color:var(--text)}
.day .n{font-size:12px;font-weight:600}
.day.today .n{color:var(--accent)}
.day .ev{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;padding-left:5px;border-left:3px solid var(--accent)}
.dotrow{display:none}
.week{overflow-x:auto}
.week table{border-collapse:separate;border-spacing:4px;width:100%;min-width:640px}
.week th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:2px 4px}
.week td input{width:100%}
.week td.lbl{font-size:12px;color:var(--muted);width:70px}
.week th.today{color:var(--accent)}
.cat{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 2px}
.members{display:flex;flex-wrap:wrap;gap:6px}
.m{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.note{white-space:pre-wrap}
.banner{background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.hidden{display:none}
nav button{display:flex;align-items:center;gap:6px}
.mob{display:none}
.mday{background:var(--surface2);border-radius:12px;padding:10px 12px;margin-top:10px}
.mday.today{outline:2px solid var(--accent)}
.mday h3{font-size:15px;margin-bottom:6px}
.mday label{display:flex;align-items:center;gap:8px;margin-top:6px}
.mday label span{width:76px;font-size:12px;color:var(--muted);flex:0 0 auto}
.mday label input{flex:1;background:var(--surface)}
@media (min-width:901px){.top h1{font-size:26px}main{padding:24px 16px}.card{padding:18px}.day{min-height:84px}.grid{gap:18px}}
@media (max-width:700px){
  .grid{grid-template-columns:1fr !important}
  .calcard{grid-column:auto !important}
  main{padding:12px 12px calc(92px + env(safe-area-inset-bottom,0px))}
  .wrap{padding:10px 12px}
  input,select,textarea{font-size:16px;min-height:44px;padding:8px 10px}
  input[type=checkbox]{width:24px;height:24px;min-height:0;flex:0 0 auto;accent-color:var(--accent)}
  button.btn,button.ghost{min-height:44px;padding:8px 14px}
  button.x{font-size:22px;min-width:40px;min-height:40px}
  .row>select,.row>input[type=time]{flex:1 1 40%}
  .row>button.btn{flex:1 1 100%}
  .list li{padding:10px 0}
  .day{min-height:50px;padding:3px}
  .day .ev{display:none}
  .day .dotrow{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap}
  .week.desk{display:none}
  .mob{display:block}
  header nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;overflow:visible}
  header nav button{flex:1 1 0;flex-direction:column;gap:1px;border:0;background:none;border-radius:10px;padding:6px 0;font-size:11px;min-width:0}
  header nav button .ic{font-size:20px;line-height:1.1}
  header nav button.on{background:var(--surface2);color:var(--accent);font-weight:700}
  .status{font-size:11px}
}
/* dense week strips */
.weekstrip-wrap,.schoolweek-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(76px,1fr));gap:6px;min-width:560px}
.wday{background:var(--surface2);border-radius:8px;padding:5px 6px;min-height:92px;display:flex;flex-direction:column;gap:3px;color:var(--text);text-decoration:none}
.wday.today{box-shadow:inset 0 0 0 2px var(--accent)}
.wday .wd{font-size:11px;color:var(--day);display:flex;justify-content:space-between;align-items:baseline}
.wday .wd b{color:var(--day);font-size:12px}
.wday.today .wd,.wday.today .wd b{color:var(--accent)}
.wev{font-size:10.5px;line-height:1.25;border-left:2px solid var(--accent);padding-left:4px;white-space:normal;overflow-wrap:anywhere;width:100%;box-sizing:border-box;margin:2px 0}
.wev b{font-weight:600}
.wev.all{border-color:var(--muted);color:var(--muted)}
.wev.none{border:0;padding-left:0;color:var(--muted)}
.schoolweek{display:grid;grid-template-columns:88px repeat(5,minmax(96px,1fr));gap:4px;min-width:600px}
.schoolweek .sh{font-size:11px;color:var(--day);text-align:center;padding:2px 0}
.schoolweek .sh.today{color:var(--accent);font-weight:700}
.schoolweek .sn{font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;padding-right:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.schoolweek .sc{background:var(--surface2);border-radius:8px;padding:4px 5px;min-height:74px}
.schoolweek .sc.today{box-shadow:inset 0 0 0 1px var(--accent)}
.sitem{font-size:10.5px;line-height:1.25;margin-bottom:3px;overflow-wrap:anywhere;position:relative;padding-right:13px}
.sitem.done{text-decoration:line-through;color:var(--muted)}
.sitem input{width:14px;height:14px;margin:0 3px 0 0;vertical-align:-2px;accent-color:var(--accent)}
.sitem .sic{font-size:10px;margin-right:2px}
.sitem.none{color:var(--muted)}
.schoolweek .sitem .x{position:absolute;right:-3px;top:-1px;font-size:12px;min-width:0;min-height:0;padding:0 2px;line-height:1;vertical-align:top}
.docsrow{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px;font-size:12px}
.docsrow a{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.weeknotes{padding:8px 12px}
.wnhead{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:2px}
.wn{font-size:12px;line-height:1.35;display:flex;gap:6px;margin-top:3px}
.wn b{white-space:nowrap}
.gcalmob,.schoolmob{display:none}
.gday{border-bottom:1px solid var(--line);padding:7px 0}
.gday:last-child{border-bottom:0}
.gdh{font-size:14px;font-weight:700;color:var(--day);display:flex;justify-content:space-between;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid var(--line);text-decoration:none}
.gdh.today{color:var(--accent)}
.gday ul{margin:0;padding:0;list-style:none}
.gday li{font-size:13px;padding:2px 0 2px 7px;display:flex;gap:6px;border-left:2px solid var(--accent);margin:3px 0}
.gday li.all{border-left-color:var(--muted)}
.gday li b{font-weight:600;white-space:nowrap}
.smlist{margin-top:2px}
.smwho{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;margin:12px 0 4px}
.smday{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.smday:last-child{border-bottom:0}
.smdate{flex:0 0 48px;font-size:12px;font-weight:600;color:var(--day);padding-top:1px}
.smdate.today{color:var(--accent)}
.smitems{flex:1;min-width:0}
.smitems .sitem{font-size:12.5px;padding-right:16px}
.schoolmob .sitem .x{position:absolute;right:0;top:0;font-size:12px;min-width:0;min-height:0;padding:0 2px;line-height:1}
.chip.daytag{background:#c79a1c;color:#2a2723;font-weight:600}
.chip.daytag.weekday{background:#2f7fbf;color:#fff}
.daybtn{font-size:9.5px;line-height:1;min-width:28px;height:26px;padding:0 3px;border-radius:6px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);cursor:pointer;font-weight:600}
.daybtn.on{background:#c79a1c;color:#2a2723;border-color:#c79a1c}
.daybtn.on.weekday{background:#2f7fbf;color:#fff;border-color:#2f7fbf}
details.card summary{cursor:pointer;font-family:Georgia,"Times New Roman",serif;font-size:16px;font-weight:600;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary:after{content:" +";color:var(--accent)}
details.card[open] summary:after{content:" −"}
@media (max-width:700px){
  .weekstrip-wrap,.schoolweek-wrap{display:none}
  .gcalmob,.schoolmob{display:block}
  .cal-head{gap:6px}
  .cal-head h2{font-size:16px !important;line-height:1.2}
  .gcalhead{font-size:15px !important;line-height:1.2}
  .cal-head .ghost{padding:5px 8px;min-height:36px;font-size:12px}
  .schoolhead h2{min-width:0}
  .schoolhead .row button[data-act="thisSW"]{display:none}
  .schoolfilters>button.btn,.schoolfilters>button.ghost{flex:0 1 auto;min-height:36px;padding:6px 10px;font-size:13px}
  .daybtn{min-width:32px;height:30px;font-size:10.5px}
  .weekstrip{grid-template-columns:repeat(7,minmax(64px,1fr));min-width:470px;gap:4px}
  .wday{min-height:80px;padding:4px}
  .schoolweek{grid-template-columns:64px repeat(5,minmax(76px,1fr));min-width:470px;gap:3px}
  .schoolweek .sc{min-height:64px;padding:3px 4px}
  .sitem{font-size:10px}
  .schoolweek .sitem .x{font-size:13px;min-width:14px;min-height:0;padding:0 1px}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>🏡 Family Hub</h1>
      <span class="status" id="status">Loading…</span>
    </div>
    <nav id="nav"></nav>
  </div>
</header>
<main>
  <div id="banner" class="banner hidden"></div>
  <div id="view"></div>
</main>

<script>
(function(){
"use strict";
var TABS=[["home","Today","🏠"],["cal","Calendar","📅"],["meals","Dinner","🍽️"],["shop","Shopping","🛒"],["school","School","🎒"],["more","More","☰"]];
var COLORS=["#d9622b","#2f7fbf","#3f8f5a","#b0489a","#c79a1c","#6b5bd2","#1f9aa3","#c0392b"];
var CATS=["Produce","Dairy & eggs","Meat & fish","Pantry","Frozen","Household","Other"];
var SLOTS=[["d","Dinner"]];
var DEFAULT={members:[],events:[],meals:{},shopping:[],chores:[],notes:[],contacts:[],recipes:[],staples:["salt","pepper","oil","butter","onion","garlic","flour","sugar","rice","pasta","eggs","milk"],school:[],rejected:[],docs:[],weekNotes:[]};

var state=clone(DEFAULT), tab="home";
var now=new Date();
var calY=now.getFullYear(), calM=now.getMonth(), selDate=iso(now);
var weekStart=mondayOf(now);
var db=null, docRef=null, saving=false, pending=false, lastSaved="";
var loaded=false;

function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return Math.random().toString(36).slice(2,10)}
function pad(n){return n<10?"0"+n:""+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function $(id){return document.getElementById(id)}
function member(id){for(var i=0;i<state.members.length;i++)if(state.members[i].id===id)return state.members[i];return null}
function colorOf(id){var m=member(id);return m?m.color:"var(--muted)"}
function nameOf(id){var m=member(id);return m?m.name:"Everyone"}
function whoOptions(sel){
  return '<option value="">Everyone</option>'+state.members.map(function(m){return '<option value="'+m.id+'"'+(m.id===sel?" selected":"")+'>'+esc(m.name)+'</option>'}).join("");
}
function fmtDate(s){return parse(s).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}

/* ---------- persistence (Cloudflare Pages Function + D1) ---------- */
function setStatus(t){$("status").textContent=t}
function normalize(d){
  var s=clone(DEFAULT);
  if(d&&typeof d==="object"){for(var k in s){if(d[k]!==undefined&&d[k]!==null)s[k]=d[k]}}
  return s;
}
function changed(){render();scheduleSave()}
var saveTimer=null;
function scheduleSave(){
  setStatus("Saving…");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){saveTimer=null;flush()},450);
}
function authProblem(){
  var b=$("banner");b.classList.remove("hidden");
  b.textContent="You’re not signed in, or the server isn’t set up yet. Reload the page and sign in.";
  setStatus("Not saved");
  if(!loaded){loaded=true;render()}
}
function flush(){
  if(saving){pending=true;return}
  var json=JSON.stringify(state);
  if(json===lastSaved){setStatus("Saved");return}
  saving=true;
  fetch("/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({state:json})})
    .then(function(r){
      if(r.status===401||r.status===403||r.status===503){authProblem();return false}
      if(!r.ok)throw new Error("save failed");
      lastSaved=json;setStatus("Saved");return true;
    })
    .catch(function(){setStatus("Couldn’t save – will retry")})
    .then(function(){saving=false;if(pending){pending=false;flush()}});
}
function pull(first){
  if(saving||pending||saveTimer)return;
  fetch("/api/state",{headers:{"Accept":"application/json"}})
    .then(function(r){
      if(r.status===401||r.status===403||r.status===503){authProblem();return null}
      if(!r.ok)throw new Error("load failed");
      return r.json();
    })
    .then(function(d){
      if(!d)return;
      var remoteChanged=false;
      if(d.state&&d.state!==lastSaved&&d.state!==JSON.stringify(state)){
        state=normalize(JSON.parse(d.state));lastSaved=d.state;remoteChanged=true;
      }else if(d.state){lastSaved=d.state}
      if(first||!loaded){loaded=true;setStatus("Ready");render();return}
      setStatus("Synced");
      // Only repaint when another device actually changed something. Repainting on every
      // 15 s poll wiped half-typed form fields (the recipe form is not in state until saved).
      if(remoteChanged)softRender();
    })
    .catch(function(){if(first){loaded=true;render()}setStatus("Offline")});
}
function initStorage(){
  pull(true);
  setInterval(function(){if(!document.hidden)pull(false)},15000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)pull(false)});
}

/* ---------- rendering ---------- */
function renderNav(){
  $("nav").innerHTML=TABS.map(function(t){return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'"><span class="ic">'+t[2]+'</span><span class="lb">'+t[1]+'</span></button>'}).join("");
}
function render(){
  if(!loaded){return}
  renderNav();
  var active=document.activeElement;
  var v=$("view");
  var fn={home:vHome,cal:vCal,meals:vMeals,shop:vShop,school:vSchool,more:vMore}[tab]||vHome;
  v.innerHTML=fn();
  if(active&&active.id&&$(active.id)){try{$(active.id).focus()}catch(e){}}
}

function escapeRe(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function textOn(hex){
  var h=String(hex||"").replace("#","");
  if(h.length!==6)return "#fff";
  var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return (0.299*r+0.587*g+0.114*b)>150?"#2a2723":"#fff";
}
function stripMemberName(title,name){
  if(!name)return title;
  var re=new RegExp("\\b"+escapeRe(name)+"\\b","i");
  return title.replace(re,"").replace(/\s{2,}/g," ").replace(/^\s*[:–-]\s*/,"").trim();
}
function cleanEvent(e){
  var ids=[],title=String(e.title||"");
  if(e.who){
    ids.push(e.who);
    var m=member(e.who);
    if(m)title=stripMemberName(title,m.name);
  }else{
    state.members.forEach(function(m){
      var re=new RegExp("\\b"+escapeRe(m.name)+"\\b","i");
      if(re.test(title)){ids.push(m.id);title=title.replace(re,"")}
    });
    if(ids.length)title=title.replace(/\s{2,}/g," ").replace(/^\s*[:–-]\s*/,"").trim();
  }
  return {ids:ids,title:title};
}
function whoBoxes(ids,small){
  if(!ids||!ids.length)return '<span class="whobox everyone'+(small?' sm':'')+'" title="Everyone">👪</span>';
  return ids.map(function(id){
    var m=member(id);if(!m)return "";

/* ---------- recipes and dinner suggestions ---------- */
function words(x){return String(x).toLowerCase().split(/[^a-zà-ÿ]+/).filter(Boolean).map(function(w){return w.replace(/s$/,"")})}
function isStaple(ing){var iw=words(ing);return (state.staples||[]).some(function(st){var sw=words(st);return sw.length&&sw.every(function(w){return iw.indexOf(w)>=0})})}
function specialsOf(r){return (r.ingredients||[]).filter(function(i){return !isStaple(i)})}
function ikey(i){return words(i).filter(function(w){return w.length>2}).sort().join(" ")}
function findRecipe(name){name=String(name||"").trim().toLowerCase();if(!name)return null;for(var i=0;i<state.recipes.length;i++)if(state.recipes[i].name.toLowerCase()===name)return state.recipes[i];return null}
function stars(n){return "★★★★★".slice(0,n)}
function suggestDinners(overwrite, quickOnly){
  var pool=quickOnly?state.recipes.filter(function(r){return minutesOf(r)<=30}):state.recipes;
  if(!pool.length){setStatus(quickOnly?"No quick recipes yet – add one or use the AI suggestions":(state.recipes.length?"No quick recipes":"Add some recipes first"));return}
  var days=[];for(var i=0;i<7;i++)days.push(addDays(weekStart,i));
  var used={},picked={},targets=[],n=0;
  var anyTags=pool.some(function(r){return (r.days||[]).length>0});
  var respectDays=Math.random()<0.7;
  days.forEach(function(d){
    var cur=((state.meals[iso(d)]||{}).d||"").trim();
    if(cur&&!overwrite){var r=findRecipe(cur);if(r){used[r.id]=1;specialsOf(r).forEach(function(x){picked[ikey(x)]=1})}}
    else targets.push(d);
  });
  targets.forEach(function(d){
    var dow=(d.getDay()+6)%7,weekday=dow<4,best=null,bs=-1e9;
    var curName=((state.meals[iso(d)]||{}).d||"").trim();
    var curRecipe=curName?findRecipe(curName):null;
    var candidates=pool,allowRepeat=false;
    if(respectDays&&anyTags){
      var tagged=pool.filter(function(r){return (r.days||[]).indexOf(dow)>=0});
      if(tagged.length){
        var unused=tagged.filter(function(r){return !used[r.id]});
        if(unused.length)candidates=unused;
        else{candidates=tagged;allowRepeat=true}
      }else{
        var untagged=pool.filter(function(r){return !(r.days||[]).length});
        if(untagged.length)candidates=untagged;
      }
    }
    candidates.forEach(function(r){
      if(!allowRepeat&&used[r.id])return;
      var sc=(r.rating||3)*2;
      var since=r.lastMade?Math.round((d-parse(r.lastMade))/864e5):30;if(since<0)since=30;
      sc+=Math.min(since,30)/6;if(since<7)sc-=4;
      sc-=((r.effort||2)-1)*(weekday?1.5:0.5);
      sc-=(Math.max(0,minutesOf(r)-30)/10)*(weekday?1:0.3);
      if(overwrite&&((curRecipe&&r.id===curRecipe.id)||(curName&&r.name.toLowerCase()===curName.toLowerCase())))sc-=50;
      var sp=specialsOf(r);sc-=sp.length*1.2;
      var shared=sp.filter(function(x){return picked[ikey(x)]}).length;sc+=Math.min(shared,3)*1.5;
      sc+=Math.random()*(overwrite?3:1.5);
      if(sc>bs){bs=sc;best=r}
    });
    if(!best)return;
    used[best.id]=1;specialsOf(best).forEach(function(x){picked[ikey(x)]=1});
    var k=iso(d),m=state.meals[k]||{};m.d=best.name;state.meals[k]=m;n++;
  });
  var suffix=anyTags?(respectDays?" · day tags kept":" · free mix"):"";
  changed();setStatus(n?("Suggested "+n+" dinner"+(n>1?"s":"")+suffix):(quickOnly?"No free dinner slots or quick recipes left":"No free dinner slots or recipes left"));
}
function fillNextDinner(name){
  for(var i=0;i<7;i++){
    var d=addDays(weekStart,i),k=iso(d),m=state.meals[k]||{};
    if(!(m.d||"").trim()){m.d=name;state.meals[k]=m;return d}
  }
  return null;
}

  var have={};
  state.shopping.forEach(function(s){have[ikey(s.text)]=1});
  (bring.items||[]).forEach(function(b){have[ikey(b.name)]=1});

  }
  changed();setStatus(added?"Added "+added+" ingredient"+(added>1?"s":"")+" to the Hub list":"Nothing new to add");
}

  var er=null;if(editRecipe)er=state.recipes.filter(function(r){return r.id===editRecipe})[0]||null;
  var h='<div class="grid" style="margin-top:14px">';
  h+='<div class="card"><h2>'+(er?"Edit recipe":"Add a recipe")+'</h2>'+
    '<div class="row"><input type="text" id="rName" placeholder="Dish name" value="'+esc(er?er.name:"")+'"></div>'+
    '<div class="row" style="margin-top:8px"><select id="rEffort">'+[1,2,3].map(function(n){return '<option value="'+n+'"'+((er?er.effort:1)===n?" selected":"")+'>'+EFFORT[n]+'</option>'}).join("")+'</select>'+
    '<select id="rMinutes" title="Time">'+MINUTES.map(function(n){var cur=er?minutesOf(er)===n:(n===30);return '<option value="'+n+'"'+(cur?" selected":"")+'>'+n+' min</option>'}).join("")+'</select>'+
    '<select id="rRating">'+[5,4,3,2,1].map(function(n){return '<option value="'+n+'"'+((er?er.rating:3)===n?" selected":"")+'>'+stars(n)+'</option>'}).join("")+'</select></div>'+
    '<div class="row" id="rDays" style="margin-top:8px;gap:4px" title="Leave all unchecked for any day; tagged days are a preference (about 70%), not a hard rule."><span style="font-size:12px;color:var(--muted);flex:0 0 auto">Prefers:</span>'+DAYNAMES.map(function(n,i){var on=er&&(er.days||[]).indexOf(i)>=0;return '<label class="chip" style="display:flex;align-items:center;gap:3px;padding:3px 6px"><input type="checkbox" data-day="'+i+'" style="width:14px;height:14px;min-height:0;margin:0"'+(on?" checked":"")+'>'+n+'</label>'}).join("")+'</div>'+
    '<div style="color:var(--muted);font-size:11px;margin-top:-2px">On about 70% of suggestions these days use this dish; the other 30% mix freely.</div>'+
    '<textarea id="rIngr" rows="6" style="width:100%;margin-top:8px" placeholder="Ingredients, one per line">'+esc(er?er.ingredients.join("\n"):"")+'</textarea>'+
    '<input type="text" id="rNotes" style="width:100%;margin-top:8px" placeholder="Notes or link (optional)" value="'+esc(er&&er.notes?er.notes:"")+'">'+
    '<div class="row" style="margin-top:8px"><button class="btn" data-act="saveRecipe">'+(er?"Save":"Add recipe")+'</button>'+(er?'<button class="ghost" data-act="cancelRecipe">Cancel</button>':"")+'</div></div>';
  h+='<div class="card"><h2>Everyday ingredients</h2><div style="color:var(--muted);font-size:13px;margin-bottom:6px">Things you always have at home. Recipes that need many <i>other</i> ingredients get suggested less. Separate with commas.</div>'+
    '<textarea id="stapleText" data-staples="1" rows="5" style="width:100%">'+esc((state.staples||[]).join(", "))+'</textarea></div></div>';
  h+='<div class="card" style="margin-top:14px"><h2>Recipe book ('+state.recipes.length+')</h2>';
  if(!state.recipes.length)h+='<div class="empty">No recipes yet. Add the dishes you cook often; the planner suggests from these.</div>';
  else h+='<ul class="list">'+state.recipes.slice().sort(function(a,b){return a.name.localeCompare(b.name)}).map(function(r){
    var sp=specialsOf(r);
    var dayText=(r.days||[]).map(function(n){return DAYNAMES[n]}).join(", ");
    var dayCls=(r.days||[]).some(function(n){return n>=4})?" weekend":" weekday";
    var dayBtns=DAYNAMES.map(function(n,i){
      var on=(r.days||[]).indexOf(i)>=0;
      return '<button class="daybtn'+(on?" on":"")+(i<4?" weekday":"")+'" data-recipe-day="'+r.id+'" data-day="'+i+'" title="'+n+'">'+n.slice(0,2)+'</button>';
    }).join("");
    return '<li style="align-items:flex-start"><span class="t"><b>'+esc(r.name)+'</b> <span class="chip">'+EFFORT[r.effort||1]+' · '+minutesOf(r)+' min</span> <span class="chip">'+stars(r.rating||3)+'</span>'+
      (dayText?' <span class="chip daytag'+dayCls+'" title="About 70% of suggestions keep this dish on these days">'+esc(dayText)+'</span>':'')+
      (r.lastMade?' <span class="chip">made '+esc(parse(r.lastMade).toLocaleDateString(undefined,{day:"numeric",month:"short"}))+'</span>':'')+
      '<div style="color:var(--muted);font-size:12px;margin-top:2px">'+(sp.length?'Needs: '+esc(sp.join(", ")):'Only everyday ingredients')+(r.notes?' · '+esc(r.notes):'')+'</div></span>'+
      '<span class="row" style="flex:0 0 auto">'+dayBtns+'<button class="ghost" data-act="madeToday" data-id="'+r.id+'">Made today</button><button class="ghost" data-act="editRecipe" data-id="'+r.id+'">Edit</button><button class="x" data-act="delRecipe" data-id="'+r.id+'">×</button></span></li>'}).join("")+'</ul>';
  h+='</div>';
  h+='<div class="card" style="margin-top:14px"><h2>New dinner ideas <button class="ghost" data-act="getIdeas">'+(ideasBusy?"Thinking…":"✨ Suggest 4 dinners")+'</button></h2>'+
    '<div class="row" style="margin:4px 0 6px;font-size:13px"><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="ideaQuick" checked> Quick weeknight (≤30 min)</label></div>'+
    '<div style="color:var(--muted);font-size:13px">Everyday supermarket ingredients, few spices, short cooking time. Based on the dishes you like and what you always have at home. Check before cooking.</div>';
  if(ideasErr)h+='<div style="color:var(--danger);margin-top:8px">'+esc(ideasErr)+'</div>';
  if(ideas.length)h+='<ul class="list" style="margin-top:8px">'+ideas.map(function(x,i){
    return '<li style="align-items:flex-start"><span class="t"><b>'+esc(x.name)+'</b> <span class="chip">'+EFFORT[x.effort]+' · '+(x.minutes||minutesOf(x))+' min</span><div style="color:var(--muted);font-size:13px">'+esc(x.why)+'</div><div style="font-size:12px;margin-top:2px">'+esc(x.ingredients.join(", "))+'</div></span>'+
      '<span class="row" style="flex:0 0 auto"><button class="btn" data-act="addIdea" data-i="'+i+'">Add</button><button class="ghost" data-act="useIdea" data-i="'+i+'">Use this week</button><button class="ghost" data-act="rejectIdea" data-i="'+i+'">Not for us</button></span></li>'}).join("")+'</ul>';
  return h+'</div>';
}

/* ---------- school ---------- */
function schoolItem(x){
  var icon=x.type==="homework"?"":x.type==="activity"?"⚽":"📌";
  var h='<div class="sitem'+(x.done?" done":"")+'" title="'+esc(x.title)+'">';
  if(x.type==="homework")h+='<input type="checkbox" data-act="toggleSchool" data-id="'+x.id+'"'+(x.done?" checked":"")+'>';
  else h+='<span class="sic">'+icon+'</span>';
  h+=esc(x.title)+'<button class="x" data-act="delSchool" data-id="'+x.id+'" title="Delete">×</button>';
  return h+'</div>';
}
function schoolWeekTable(start, filter){
  var days=[];for(var i=0;i<5;i++)days.push(addDays(start,i));
  var today=iso(new Date());
  var members=state.members.filter(function(m){return !filter||m.id===filter});
  function itemsFor(who,k){
    return state.school.filter(function(x){return x.date===k&&x.who===who}).sort(function(a,b){return a.type.localeCompare(b.type)||a.title.localeCompare(b.title)});
  }
  var h='<div class="schoolweek-wrap"><div class="schoolweek">';
  h+='<div class="sh"></div>';
  days.forEach(function(d){var k=iso(d);h+='<div class="sh'+(k===today?' today':'')+'">'+esc(d.toLocaleDateString(undefined,{weekday:"short"}))+' <b>'+d.getDate()+'</b></div>'});
  if(!members.length)h+='<div class="sn">–</div><div class="sc" style="grid-column:span 5"><div class="empty">Add the children under Family</div></div>';
  members.forEach(function(m){
    h+='<div class="sn"><span class="dot" style="background:'+m.color+'"></span>'+esc(m.name)+'</div>';
    days.forEach(function(d){
      var k=iso(d),items=itemsFor(m.id,k);
      h+='<div class="sc'+(k===today?' today':'')+'">';
      if(!items.length)h+='<div class="sitem none">–</div>';
      items.forEach(function(x){h+=schoolItem(x)});
      h+='</div>';
    });
  });
  h+='</div></div>';

  // Vertical version for phones.
  h+='<div class="schoolmob">';
  if(!members.length)h+='<div class="empty">Add the children under Family</div>';
  members.forEach(function(m){
    h+='<div class="smwho"><span class="dot" style="background:'+m.color+'"></span>'+esc(m.name)+'</div>';
    var any=false;
    days.forEach(function(d){
      var k=iso(d),items=itemsFor(m.id,k);
      if(!items.length)return;
      any=true;
      h+='<div class="smday"><div class="smdate'+(k===today?' today':'')+'">'+esc(d.toLocaleDateString(undefined,{weekday:"short"}))+' '+d.getDate()+'</div><div class="smitems">';
      items.forEach(function(x){h+=schoolItem(x)});
      h+='</div></div>';
    });
    if(!any)h+='<div class="empty">No school items this week.</div>';
  });
  h+='</div>';
  return h;
}
function vSchool(){
  var days=[];for(var i=0;i<5;i++)days.push(addDays(schoolWeek,i));
  var label=days[0].toLocaleDateString(undefined,{day:"numeric"})+"–"+days[4].toLocaleDateString(undefined,{day:"numeric",month:"short"});
  var h='<div class="card"><div class="cal-head schoolhead"><button class="ghost" data-act="prevSW">‹ Prev</button><h2 style="font-size:18px">Ukeplan '+esc(label)+'</h2><span class="row"><button class="ghost" data-act="thisSW">This week</button><button class="ghost" data-act="nextSW">Next ›</button></span></div>';
  h+='<div class="row schoolfilters" style="margin-bottom:8px"><button class="'+(schoolFilter===""?"btn":"ghost")+'" data-act="schoolFilter" data-id="">Everyone</button>'+state.members.map(function(m){return '<button class="'+(schoolFilter===m.id?"btn":"ghost")+'" data-act="schoolFilter" data-id="'+m.id+'">'+esc(m.name)+'</button>'}).join("")+'</div>';
  if(!state.members.length)h+='<div class="empty">Add your children as family members on the Today tab first.</div>';
  h+=schoolWeekTable(schoolWeek,schoolFilter);
  var wn=weekNotesFor(iso(schoolWeek),schoolFilter);
  if(wn.length)h+='<div class="wnhead" style="margin-top:12px">Week notes</div>'+wn.map(weekNoteHtml).join("");
  var docs=(state.docs||[]).filter(function(d){return !schoolFilter||!d.who||d.who===schoolFilter});
  if(docs.length)h+='<div class="docsrow">'+docs.slice().reverse().map(function(d){return '<a href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.label)+(d.who?' · '+esc(nameOf(d.who)):'')+' PDF</a>'}).join("")+'</div>';
  h+='</div>';
  h+='<details class="card" style="margin-top:14px"><summary>Add homework or activity</summary><div class="row" style="margin-top:8px"><select id="schoolWho">'+state.members.map(function(m){return '<option value="'+m.id+'">'+esc(m.name)+'</option>'}).join("")+'</select><input type="date" id="schoolDate" value="'+esc(iso(new Date()))+'"><select id="schoolType"><option value="homework">Homework</option><option value="activity">Activity</option><option value="event">School event</option></select></div>'+
    '<div class="row" style="margin-top:8px"><input type="text" id="schoolTitle" placeholder="e.g. Maths p. 45, swimming kit"><button class="btn" data-act="addSchool">Add</button></div></details>';
  h+='<details class="card" style="margin-top:14px"><summary>Import school letter</summary><div style="color:var(--muted);font-size:13px;margin:8px 0 6px">Send the week letter (PDF) in chat and it is imported for you. You can also paste JSON here. Names must match your family members.</div>'+
    '<textarea id="schoolImport" rows="5" style="width:100%" placeholder=\'[{"child":"Emma","date":"2026-11-03","type":"homework","title":"Maths p.45","subject":"Maths"}]\'></textarea><div class="row" style="margin-top:8px"><button class="btn" data-act="importSchool">Import</button></div>'+
    (importMsg?'<div style="margin-top:8px;font-size:13px">'+esc(importMsg)+'</div>':'')+'</details>';
  return h;
}
function vMore(){
  return '<div style="margin-bottom:14px">'+vChores()+'</div>'+vInfo()+
    '<div class="card" style="margin-top:14px"><h2>Backup</h2><div style="color:var(--muted);font-size:13px;margin-bottom:8px">Download everything in the Hub as a file you can keep.</div><button class="ghost" data-act="exportData">Download backup</button></div>';
}

/* ---------- actions ---------- */
function val(id){var e=$(id);return e?e.value.trim():""}
function del(arr,id){return state[arr].filter(function(x){return x.id!==id})}
var actions={
  suggestWeek:function(el){suggestDinners(el.dataset.over==="1",el.dataset.quick==="1")},
  reloadGcal:function(){gcal.events=null;gcal.error="";render();loadGcal()},
  reloadBring:function(){bring.items=null;bring.error="";render();loadBring()},
  copyList:function(){
    var t=state.shopping.filter(function(x){return !x.done}).map(function(x){return x.text}).join("\n");
    if(!t){setStatus("Hub list is empty");return}
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){setStatus("Copied "+t.split("\n").length+" items")},function(){setStatus("Couldn’t copy")});
  },
  saveRecipe:function(){
    var name=val("rName");if(!name)return;
    var ingr=($("rIngr").value||"").split("\n").map(function(x){return x.trim()}).filter(Boolean);
    var effort=+val("rEffort")||1;
    var days=[].slice.call(document.querySelectorAll("#rDays input:checked")).map(function(el){return +el.dataset.day});
    var rec={name:name,effort:effort,minutes:+val("rMinutes")||minutesOf({effort:effort}),rating:+val("rRating")||3,ingredients:ingr,notes:val("rNotes"),days:days};
    if(editRecipe){state.recipes.forEach(function(r){if(r.id===editRecipe){r.name=rec.name;r.effort=rec.effort;r.minutes=rec.minutes;r.rating=rec.rating;r.ingredients=rec.ingredients;r.notes=rec.notes;r.days=rec.days}});editRecipe=null}
    else{rec.id=uid();rec.lastMade="";state.recipes.push(rec)}
    changed();
  },
  editRecipe:function(el){editRecipe=el.dataset.id;render();window.scrollTo(0,0)},
  cancelRecipe:function(){editRecipe=null;render()},
  delRecipe:function(el){state.recipes=del("recipes",el.dataset.id);changed()},
  madeToday:function(el){state.recipes.forEach(function(r){if(r.id===el.dataset.id)r.lastMade=iso(new Date())});changed()},
  getIdeas:function(){
    if(ideasBusy)return;ideasBusy=true;ideasErr="";var quick=$("ideaQuick")?$("ideaQuick").checked:true;render();
    var liked=state.recipes.filter(function(r){return (r.rating||3)>=4}).map(function(r){return r.name});
    getJson("/api/ideas",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({liked:liked,all:state.recipes.map(function(r){return r.name}),staples:state.staples,rejected:state.rejected.slice(-40),quick:quick,maxMinutes:quick?30:60})})
      .then(function(x){ideasBusy=false;if(x.ok&&x.d.ideas){ideas=x.d.ideas;if(!ideas.length)ideasErr="No usable ideas came back. Try again."}else ideasErr=(x.d&&x.d.error)||"Could not get ideas.";render()})
      .catch(function(){ideasBusy=false;ideasErr="Could not get ideas.";render()});
  },
  addIdea:function(el){
    var x=ideas[+el.dataset.i];if(!x)return;
    state.recipes.push({id:uid(),name:x.name,effort:x.effort,minutes:x.minutes||minutesOf(x),rating:3,ingredients:x.ingredients,notes:"AI idea – check before cooking",lastMade:"",days:[]});
    ideas.splice(+el.dataset.i,1);changed();
  },
  useIdea:function(el){
    var x=ideas[+el.dataset.i];if(!x)return;
    state.recipes.push({id:uid(),name:x.name,effort:x.effort,minutes:x.minutes||minutesOf(x),rating:3,ingredients:x.ingredients,notes:"AI idea – check before cooking",lastMade:"",days:[]});
    fillNextDinner(x.name);
    ideas.splice(+el.dataset.i,1);changed();
  },
  rejectIdea:function(el){var x=ideas[+el.dataset.i];if(!x)return;state.rejected.push(x.name);ideas.splice(+el.dataset.i,1);changed()},
  prevSW:function(){schoolWeek=addDays(schoolWeek,-7);render()},
  nextSW:function(){schoolWeek=addDays(schoolWeek,7);render()},
  thisSW:function(){schoolWeek=mondayOf(new Date());render()},
  schoolFilter:function(el){schoolFilter=el.dataset.id||"";render()},
  addSchool:function(){
    var t=val("schoolTitle"),who=val("schoolWho"),date=val("schoolDate");
    if(!t||!who||!/^\d{4}-\d{2}-\d{2}$/.test(date))return;
    state.school.push({id:uid(),who:who,date:date,type:val("schoolType")||"homework",title:t,subject:"",done:false});
    changed();
  },
  toggleSchool:function(el){state.school.forEach(function(x){if(x.id===el.dataset.id)x.done=el.checked});changed()},
  delSchool:function(el){state.school=del("school",el.dataset.id);changed()},
  importSchool:function(){
    var t=val("schoolImport");if(!t)return;
    var data;try{data=JSON.parse(t)}catch(e){importMsg="That isn’t valid JSON. Paste exactly what Claude gave you.";render();return}
    var arr=Array.isArray(data)?data:(data&&data.items);
    if(!Array.isArray(arr)){importMsg="No items found in that text.";render();return}
    var added=0,dup=0,unknown={};
    arr.forEach(function(x){
      if(!x||!x.title||!/^\d{4}-\d{2}-\d{2}$/.test(x.date||""))return;
      var nm=String(x.child||"").trim().toLowerCase();
      var m=state.members.filter(function(m){return m.name.toLowerCase()===nm})[0];
      if(!m){unknown[x.child||"(none)"]=1;return}
      var type=["homework","activity","event"].indexOf(x.type)>=0?x.type:"homework";
      var title=String(x.title).slice(0,200);
      if(state.school.some(function(s){return s.who===m.id&&s.date===x.date&&s.title.toLowerCase()===title.toLowerCase()})){dup++;return}
      state.school.push({id:uid(),who:m.id,date:x.date,type:type,title:title,subject:String(x.subject||"").slice(0,60),done:false});added++;
    });
    var un=Object.keys(unknown);
    importMsg="Added "+added+(dup?", skipped "+dup+" duplicate"+(dup>1?"s":""):"")+(un.length?". Not added, unknown names (add them as family members first): "+un.join(", "):"")+".";
    changed();
  },
  exportData:function(){
    var b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});var u=URL.createObjectURL(b);
    var a=document.createElement("a");a.href=u;a.download="familyhub-backup-"+iso(new Date())+".json";document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},1000);
  },
  addMember:function(){var n=val("newMember");if(!n)return;state.members.push({id:uid(),name:n,color:COLORS[state.members.length%COLORS.length]});changed()},
  delMember:function(el){var id=el.dataset.id;state.members=del("members",id);state.events.forEach(function(e){if(e.who===id)e.who=""});state.chores.forEach(function(e){if(e.who===id)e.who=""});changed()},
  prevM:function(){calM--;if(calM<0){calM=11;calY--}render()},
  nextM:function(){calM++;if(calM>11){calM=0;calY++}render()},
  todayM:function(){var n=new Date();calY=n.getFullYear();calM=n.getMonth();selDate=iso(n);render()},
  selDay:function(el){selDate=el.dataset.date;render()},
  addEvent:function(){var t=val("evTitle"),date=val("evDate")||selDate;if(!t||!/^\d{4}-\d{2}-\d{2}$/.test(date))return;state.events.push({id:uid(),date:date,time:val("evTime"),title:t,who:val("evWho")});changed()},
  delEvent:function(el){state.events=del("events",el.dataset.id);changed()},
  prevW:function(){weekStart=addDays(weekStart,-7);render()},
  nextW:function(){weekStart=addDays(weekStart,7);render()},
  thisW:function(){weekStart=mondayOf(new Date());render()},
  mealsToShop:function(){addSpecials()},
  addShop:function(){var t=val("shopText");if(!t)return;state.shopping.push({id:uid(),text:t,cat:val("shopCat")||"Other",done:false});changed()},
  toggleShop:function(el){state.shopping.forEach(function(s){if(s.id===el.dataset.id)s.done=el.checked});changed()},
  delShop:function(el){state.shopping=del("shopping",el.dataset.id);changed()},
  clearDone:function(){state.shopping=state.shopping.filter(function(s){return !s.done});changed()},
  addChore:function(){var t=val("choreText");if(!t)return;state.chores.push({id:uid(),text:t,who:val("choreWho"),done:false});changed()},
  toggleChore:function(el){state.chores.forEach(function(s){if(s.id===el.dataset.id)s.done=el.checked});changed()},
  delChore:function(el){state.chores=del("chores",el.dataset.id);changed()},
  clearChores:function(){state.chores=state.chores.filter(function(s){return !s.done});changed()},
  addNote:function(){var t=val("noteText");if(!t)return;state.notes.push({id:uid(),text:t});changed()},
  delNote:function(el){state.notes=del("notes",el.dataset.id);changed()},
  addContact:function(){var n=val("cName");if(!n)return;state.contacts.push({id:uid(),name:n,phone:val("cPhone")});changed()},
  delContact:function(el){state.contacts=del("contacts",el.dataset.id);changed()}
};

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-tab]");
  if(t){tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  var rd=e.target.closest("[data-recipe-day]");
  if(rd){
    var rid=rd.dataset.recipeDay,dd=+rd.dataset.day;
    state.recipes.forEach(function(r){
      if(r.id!==rid)return;
      var days=(r.days||[]).slice();
      var idx=days.indexOf(dd);
      if(idx>=0)days.splice(idx,1);else days.push(dd);
      days.sort(function(a,b){return a-b});
      r.days=days;
    });
    changed();
    return;
  }
  var a=e.target.closest("[data-act]");
  if(a&&actions[a.dataset.act]&&a.type!=="checkbox"){actions[a.dataset.act](a)}
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.staples){state.staples=el.value.split(/[,\n]/).map(function(x){return x.trim()}).filter(Boolean);scheduleSave();return}
  if(el.dataset&&el.dataset.act&&el.type==="checkbox"){actions[el.dataset.act](el);return}
  if(el.dataset&&el.dataset.meal){
    var p=el.dataset.meal.split("|");
    var day=state.meals[p[0]]||{};day[p[1]]=el.value.trim();
    if(!day.b&&!day.l&&!day.d)delete state.meals[p[0]];else state.meals[p[0]]=day;
    scheduleSave();
  }
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"||!e.target.id)return;
  var map={schoolTitle:"addSchool",newMember:"addMember",evTitle:"addEvent",shopText:"addShop",choreText:"addChore",noteText:"addNote",cName:"addContact",cPhone:"addContact"};
  if(map[e.target.id])actions[map[e.target.id]]();
});

renderNav();
initStorage();
loadGcal();loadBring();
setInterval(function(){if(!document.hidden)loadBring()},60000);
setInterval(function(){if(!document.hidden)loadGcal()},600000);
})();
</script>
</body>
